name: CI
on:
  push:
    branches:
    - main
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flake: [base, python-poetry]
    steps:
    - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
    - name: Init and check
      env:
        FLAKE: ${{ matrix.flake }}
      run: |
        mkdir tmp && cd tmp
        nix flake init -t ../#${FLAKE}
        git add .
        nix flake check
